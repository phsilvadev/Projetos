<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BioLink Editor - Login Variant 1</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1", // Indigo-500 equivalent from screenshot
                        "primary-dark": "#4f46e5",
                        "background-light": "#f3f4f6", // Gray-100
                        "background-dark": "#0f172a", // Slate-900
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b", // Slate-800
                        "sidebar-dark": "#111827", // Gray-900
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'phone': '0 25px 50px -12px rgba(0, 0, 0, 0.5)',
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'glow': '0 0 20px rgba(99, 102, 241, 0.5)',
                    }
                },
            },
        };
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
        .app-bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .dark .app-bg-pattern {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 font-sans h-screen flex flex-col items-center justify-center app-bg-pattern relative overflow-hidden selection:bg-primary selection:text-white">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="w-full max-w-md px-6 z-10">
<div class="bg-surface-light dark:bg-surface-dark rounded-3xl shadow-2xl border border-gray-200 dark:border-gray-700 p-8 md:p-10 relative overflow-hidden transition-all hover:shadow-glow/20">
<div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-purple-500 via-primary to-blue-500"></div>
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-14 h-14 bg-gradient-to-tr from-purple-500 to-indigo-500 rounded-2xl flex items-center justify-center shadow-lg mb-5 transform rotate-3 hover:rotate-6 transition-transform duration-300">
<span class="material-icons-round text-white text-3xl">auto_awesome</span>
</div>
<h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Welcome Back</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm">Enter your credentials to manage your BioLinks.</p>
</div>
<form class="space-y-5">
<div>
<label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5 ml-1" for="email">Email or Username</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 text-lg group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-sm outline-none" id="email" placeholder="hello@rockagency.com" type="email"/>
</div>
</div>
<div>
<label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1.5 ml-1" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 text-lg group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:ring-2 focus:ring-primary focus:border-transparent transition-all text-sm outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300 transition-colors cursor-pointer" type="button">
<span class="material-icons-round text-lg">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-center justify-between text-xs mt-2">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-gray-600 dark:text-gray-400 cursor-pointer select-none" for="remember-me">Remember me</label>
</div>
<a class="font-medium text-primary hover:text-primary-dark transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-lg shadow-primary/30 text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all transform hover:-translate-y-0.5 mt-6" type="button">
                    Log In
                    <span class="material-icons-round text-sm">login</span>
</button>
</form>
<div class="mt-8 relative flex items-center justify-center">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative bg-surface-light dark:bg-surface-dark px-4 text-xs text-gray-500 font-medium">Or continue with</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-3">
<button class="flex justify-center items-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group" type="button">
<i class="fab fa-google text-red-500 mr-2 group-hover:scale-110 transition-transform"></i>
                    Google
                </button>
<button class="flex justify-center items-center py-2.5 px-4 border border-gray-200 dark:border-gray-700 rounded-xl shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors group" type="button">
<i class="fab fa-github text-gray-900 dark:text-white mr-2 group-hover:scale-110 transition-transform"></i>
                    GitHub
                </button>
</div>
<p class="mt-8 text-center text-xs text-gray-500 dark:text-gray-400">
                Don't have an account?
                <a class="font-bold text-primary hover:text-primary-dark transition-colors" href="#">Sign up for free</a>
</p>
</div>
<div class="mt-8 text-center">
<a class="inline-flex items-center gap-1.5 text-xs font-medium text-gray-500 hover:text-gray-800 dark:hover:text-gray-300 transition-colors group" href="#">
<span class="material-icons-round text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back to website
            </a>
</div>
</div>

</body></html>
