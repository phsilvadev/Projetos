<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Account - BioLink Editor</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1", // Indigo-500 equivalent from screenshot
                        "primary-dark": "#4f46e5",
                        "background-light": "#f3f4f6", // Gray-100
                        "background-dark": "#0f172a", // Slate-900
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b", // Slate-800
                        "sidebar-dark": "#111827", // Gray-900
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'phone': '0 25px 50px -12px rgba(0, 0, 0, 0.5)',
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                    }
                },
            },
        };
    </script>
<style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 20px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569;
        }
        .app-bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .app-bg-pattern {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .animation-delay-4000 {
            animation-delay: 4s;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 font-sans h-screen flex items-center justify-center overflow-hidden selection:bg-primary selection:text-white relative">
<div class="absolute inset-0 app-bg-pattern z-0"></div>
<div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none">
<div class="absolute top-[10%] left-[20%] w-72 h-72 bg-purple-300 dark:bg-purple-900 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-30 animate-blob"></div>
<div class="absolute top-[10%] right-[20%] w-72 h-72 bg-yellow-300 dark:bg-yellow-900 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
<div class="absolute bottom-[20%] left-[50%] w-72 h-72 bg-pink-300 dark:bg-pink-900 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
</div>
<div class="w-full max-w-lg mx-4 z-10 relative">
<div class="bg-surface-light dark:bg-surface-dark rounded-3xl shadow-2xl border border-white/50 dark:border-gray-700 overflow-hidden backdrop-blur-xl">
<div class="p-8 sm:p-10">
<div class="text-center mb-8">
<div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-500 to-indigo-500 shadow-lg shadow-indigo-500/30 mb-5 transform transition-transform hover:scale-110 duration-300">
<span class="material-icons-round text-white text-3xl">auto_awesome</span>
</div>
<h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2 tracking-tight">Create your account</h1>
<p class="text-gray-500 dark:text-gray-400 text-sm leading-relaxed">
                    Join thousands of creators and start building<br class="hidden sm:block"/> your custom bio link in minutes.
                </p>
</div>
<button class="w-full bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 text-gray-700 dark:text-gray-200 font-semibold py-3 px-4 rounded-xl flex items-center justify-center gap-3 transition-all duration-200 group relative overflow-hidden shadow-sm hover:shadow-md">
<div class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-gray-100/20 to-transparent translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBY_fR2XPYw4Fxx8JmEwECHJlTUBufvPjEQg0wW-MZfMAkNuSJ7AK29pnC8PEk8iUrDCLrFBocgoYTFkdzMldZUzIegtEMii1JVXtIQTs5PcslCNfqjyWVL5AOFiuZ8R9BonlLm9CHK2P15x1VuhT3SY7riQkkOStk03K8voLqMkel9thEUX5mrZWzqiquxVqZ3n7BVcFq_UwdhRH31WoqkHVUobpaIiJ4_9JDZSSIGdcZDLldAZs9Ko5zX8rHZMtKeMHLRq7oLbrnf"/>
<span>Sign up with Google</span>
</button>
<div class="relative flex py-8 items-center">
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 text-[11px] font-bold uppercase tracking-wider">Or register with email</span>
<div class="flex-grow border-t border-gray-200 dark:border-gray-700"></div>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5 ml-1" for="email">Email address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 group-focus-within:text-primary transition-colors text-xl">mail_outline</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all sm:text-sm shadow-sm" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5 ml-1" for="password">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 group-focus-within:text-primary transition-colors text-xl">lock_outline</span>
</div>
<input class="block w-full pl-11 pr-10 py-3 border border-gray-200 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800/50 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all sm:text-sm shadow-sm" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors focus:outline-none" type="button">
<span class="material-icons-round text-xl">visibility_off</span>
</button>
</div>
<div class="flex justify-between items-center mt-2 px-1">
<p class="text-xs text-gray-500 dark:text-gray-500">Min. 8 characters</p>
</div>
</div>
<div class="pt-2">
<button class="w-full flex justify-center items-center gap-2 py-3.5 px-4 border border-transparent rounded-xl shadow-lg shadow-primary/30 text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all transform hover:-translate-y-0.5" type="button">
                        Create Account
                        <span class="material-icons-round text-sm">arrow_forward</span>
</button>
</div>
</form>
</div>
<div class="px-8 py-5 bg-gray-50 dark:bg-gray-800/80 border-t border-gray-100 dark:border-gray-700 text-center">
<p class="text-sm text-gray-600 dark:text-gray-400">
                Already have an account? 
                <a class="font-bold text-primary hover:text-primary-dark transition-colors inline-flex items-center gap-1" href="#">
                    Sign in
                </a>
</p>
</div>
</div>
<div class="mt-8 flex justify-center gap-6 text-xs text-gray-400 font-medium">
<a class="hover:text-gray-600 dark:hover:text-gray-300 transition-colors" href="#">Privacy Policy</a>
<span class="text-gray-300 dark:text-gray-600">•</span>
<a class="hover:text-gray-600 dark:hover:text-gray-300 transition-colors" href="#">Terms of Service</a>
</div>
</div>
<div class="absolute top-6 right-6 z-20">
<button class="w-10 h-10 rounded-full bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 shadow-md border border-gray-100 dark:border-gray-700 flex items-center justify-center hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors" onclick="document.documentElement.classList.toggle('dark')">
<span class="material-icons-round text-xl dark:hidden">dark_mode</span>
<span class="material-icons-round text-xl hidden dark:block">light_mode</span>
</button>
</div>

</body></html>
