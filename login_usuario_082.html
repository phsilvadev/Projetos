<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BioLink Editor Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#6366f1", // Indigo-500
                        "primary-dark": "#4f46e5",
                        "background-light": "#f3f4f6", // Gray-100
                        "background-dark": "#0f172a", // Slate-900
                        "surface-light": "#ffffff",
                        "surface-dark": "#1e293b", // Slate-800
                        "sidebar-dark": "#111827", // Gray-900
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'card': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
                        'glow': '0 0 15px rgba(99, 102, 241, 0.5)',
                    }
                },
            },
        };
    </script>
<style>
        .app-bg-pattern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .app-bg-pattern {
            background-color: #0f172a;
            background-image: radial-gradient(#334155 1px, transparent 1px);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-gray-800 dark:text-gray-200 font-sans h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-white app-bg-pattern">
<header class="w-full h-16 bg-surface-light/80 dark:bg-surface-dark/80 backdrop-blur-md border-b border-gray-200 dark:border-gray-700 flex items-center justify-between px-6 md:px-12 fixed top-0 z-50">
<div class="flex items-center gap-2">
<div class="w-8 h-8 bg-gradient-to-tr from-purple-500 to-indigo-500 rounded-lg flex items-center justify-center shadow-md">
<span class="material-icons-round text-white text-sm">auto_awesome</span>
</div>
<span class="font-bold text-lg text-gray-900 dark:text-white tracking-tight">BioLink<span class="text-primary">.io</span></span>
</div>
<div>
<span class="text-sm text-gray-500 dark:text-gray-400 mr-2 hidden sm:inline">New here?</span>
<a class="text-sm font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Create an account</a>
</div>
</header>
<main class="flex-1 flex items-center justify-center p-4 relative w-full h-full">
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
<div class="bg-surface-light dark:bg-surface-dark w-full max-w-md p-8 rounded-2xl shadow-xl border border-gray-200 dark:border-gray-700 relative z-10">
<div class="text-center mb-8">
<h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">Welcome Back</h1>
<p class="text-sm text-gray-500 dark:text-gray-400">Enter your credentials to access your account.</p>
</div>
<form action="#" class="space-y-5" method="POST">
<div>
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1" for="email">Email or Username</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 text-lg">person</span>
</div>
<input class="block w-full pl-10 pr-3 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" id="email" name="email" placeholder="user@example.com" type="text"/>
</div>
</div>
<div>
<div class="flex items-center justify-between mb-1">
<label class="block text-sm font-medium text-gray-700 dark:text-gray-300" for="password">Password</label>
<a class="text-xs font-medium text-primary hover:text-primary-dark transition-colors" href="#">Forgot Password?</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-icons-round text-gray-400 text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2.5 border border-gray-300 dark:border-gray-600 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all sm:text-sm" id="password" name="password" placeholder="••••••••" type="password"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
<span class="material-icons-round text-lg">visibility</span>
</div>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-gray-600 dark:text-gray-400" for="remember-me">
                        Remember me for 30 days
                    </label>
</div>
<button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-lg text-sm font-bold text-white bg-primary hover:bg-primary-dark focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all transform active:scale-95 shadow-primary/30" type="submit">
                    Sign In
                </button>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-200 dark:border-gray-700"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-light dark:bg-surface-dark text-gray-500 dark:text-gray-400">Or continue with</span>
</div>
</div>
<div class="mt-6 grid grid-cols-2 gap-3">
<a class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors" href="#">
<i class="fab fa-google text-lg text-red-500 mr-2"></i>
<span class="sr-only">Sign in with Google</span>
                        Google
                    </a>
<a class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 dark:border-gray-600 rounded-xl shadow-sm bg-white dark:bg-gray-800 text-sm font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors" href="#">
<i class="fab fa-github text-lg text-gray-900 dark:text-white mr-2"></i>
<span class="sr-only">Sign in with GitHub</span>
                        GitHub
                    </a>
</div>
</div>
<div class="mt-8 text-center sm:hidden">
<p class="text-sm text-gray-600 dark:text-gray-400">
                    Don't have an account? 
                    <a class="font-semibold text-primary hover:text-primary-dark" href="#">Sign up</a>
</p>
</div>
</div>
<div class="absolute bottom-6 text-center w-full text-xs text-gray-400 dark:text-gray-600">
            © 2024 BioLink.io. All rights reserved.
        </div>
</main>

</body></html>
