<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Platform Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#d946ef", // Using a pink/fuchsia similar to the progress bar
              "background-light": "#ffffff",
              "background-dark": "#0f172a",
              "surface-light": "#ffffff",
              "surface-dark": "#1e293b",
              "border-light": "#e2e8f0",
              "border-dark": "#334155",
              "text-main-light": "#0f172a",
              "text-main-dark": "#f8fafc",
              "text-sub-light": "#64748b",
              "text-sub-dark": "#94a3b8",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
              sans: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem", // 12px for cards
            },
            boxShadow: {
              'card': '0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06)',
              'card-hover': '0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06)',
            }
          },
        },
      };
    </script>
<style>body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex flex-col font-sans transition-colors duration-200">
<header class="w-full px-8 py-6 flex justify-between items-center relative z-10">
<a class="text-sm font-medium text-text-sub-light dark:text-text-sub-dark hover:text-text-main-light dark:hover:text-text-main-dark transition-colors" href="#">
            Back
        </a>
<div class="absolute left-1/2 transform -translate-x-1/2 flex gap-1 h-1.5 w-24">
<div class="h-full w-1/2 bg-primary rounded-full"></div>
<div class="h-full w-1/2 bg-gray-200 dark:bg-gray-700 rounded-full"></div>
</div>
<a class="text-sm font-medium text-text-sub-light dark:text-text-sub-dark hover:text-text-main-light dark:hover:text-text-main-dark transition-colors" href="#">
            Skip
        </a>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-4 sm:px-6 py-8 w-full max-w-7xl mx-auto">
<div class="text-center mb-10 max-w-2xl">
<h1 class="text-3xl sm:text-4xl font-bold text-text-main-light dark:text-text-main-dark mb-3 tracking-tight">

            </h1>
<p class="text-text-sub-light dark:text-text-sub-dark text-sm sm:text-base">
                Pick up to five to get started. You can update at any time.
            </p>
</div>
<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-3 lg:grid-cols-3 gap-4 w-full max-w-[640px]">
<button class="group flex flex-col items-center justify-center p-6 bg-surface-light dark:bg-surface-dark border border-border-light dark:border-border-dark rounded shadow-card hover:shadow-card-hover hover:border-gray-300 dark:hover:border-gray-600 transition-all duration-200 aspect-square">
<div class="w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-tr from-yellow-400 via-red-500 to-purple-600 text-white mb-3">
<i class="fab fa-instagram text-2xl"></i>
</div>
<span class="text-xs font-semibold text-text-main-light dark:text-text-main-dark">Instagram</span>

</button>

<div class="w-12 h-12 flex items-center justify-center rounded-xl bg-gradient-to-br from-pink-500 to-red-500 text-white mb-3">

</div>
<span class="text-xs font-semibold text-text-main-light dark:text-text-main-dark">Apple Music</span>
</button>
</div>
</main>
<footer class="w-full px-8 py-8 flex flex-col items-center justify-center border-t border-transparent">
<button class="w-full max-w-[500px] h-12 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-400 dark:text-gray-500 font-semibold text-sm cursor-not-allowed hover:bg-gray-300 dark:hover:bg-gray-600 transition-colors" disabled="">
            Continue
        </button>
<div class="mt-8 w-full flex justify-start">
<a class="text-xs text-gray-300 dark:text-gray-600 hover:text-gray-400 dark:hover:text-gray-500 transition-colors" href="#">
                Cookie Preferences
            </a>
</div>
</footer>

</body></html>
